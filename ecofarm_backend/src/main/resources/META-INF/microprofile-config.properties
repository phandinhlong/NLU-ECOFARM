
cors.allowed.origins=http://localhost:3000,https://app.mycompany.com,http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed.headers=Content-Type,X-Requested-With,X-CSRF-Token
cors.max.age=3600

jwt.secret=change-me-to-a-long-random-string-at-least-32-chars
jwt.issuer=my-backend
jwt.access.expiration.minutes=15
jwt.refresh.expiration.days=7

# Mặc định = dev , Giá trị ví dụ: 900 = 15 phút, 604800 = 7 ngày
nlu.eco.farm.cookie.same-site=Lax
nlu.eco.farm.cookie.secure=false
nlu.eco.farm.cookie.access-max-age=900
nlu.eco.farm.cookie.refresh-max-age=604800

# Chỉ prod mới override
%prod.nlu.eco.farm.cookie.same-site=None
%prod.nlu.eco.farm.cookie.secure=true
%prod.nlu.eco.farm.cookie.access-max-age=900
%prod.nlu.eco.farm.cookie.refresh-max-age=2592000