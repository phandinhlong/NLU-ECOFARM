<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>NLU-ECOFARM Backend</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .card {
            background: #fff;
            padding: 32px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            text-align: center;
        }
        h1 {
            color: #2e7d32;
            margin-bottom: 8px;
        }
        p {
            color: #666;
            line-height: 1.6;
        }
        .btn-group {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .btn-primary {
            background-color: #2e7d32;
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #1b5e20;
        }
        .btn-outline {
            border: 1px solid #2e7d32;
            color: #2e7d32;
        }
        .btn-outline:hover {
            background-color: #e8f5e9;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌾 NLU-ECOFARM</h1>
        <h3>Backend API Service</h3>
        <p>Hệ thống Backend quản lý nông trại thông minh đang hoạt động.</p>
        <div class="btn-group">
            <a class="btn btn-primary" href="swagger-ui/">📖 Swagger UI Documentation</a>
            <a class="btn btn-outline" href="api/hello-world">🚀 Test API (Hello World)</a>
        </div>
    </div>
</body>
</html>
